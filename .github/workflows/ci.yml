name: CI

on:
  push:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests and generate JSON report
      run: |
        python -m pytest test_app.py -v --json-report --json-report-file=pytest-report.json
    
    - name: Process and send report to receiver
      if: always()
      env:
        REPO_NAME: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        COMMIT_SHA: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
        RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
      run: |
        python << 'PYTHON'
        import json
        import os
        import requests
        from datetime import datetime
        
        with open('pytest-report.json', 'r') as f:
            pytest_data = json.load(f)
        
        tests = []
        for test in pytest_data.get('tests', []):
            test_info = {
                'name': test.get('nodeid', test.get('name')),
                'result': test.get('outcome'),
                'failure_message': None
            }
            if test.get('outcome') == 'failed':
                call = test.get('call', {})
                longrepr = call.get('longrepr', '')
                if isinstance(longrepr, str):
                    test_info['failure_message'] = longrepr[:500]
                elif isinstance(longrepr, dict):
                    test_info['failure_message'] = str(longrepr.get('reprcrash', {}).get('message', ''))[:500]
            tests.append(test_info)
        
        summary = pytest_data.get('summary', {})
        total = summary.get('total', len(tests))
        passed = summary.get('passed', 0)
        failed = summary.get('failed', 0)
        
        report = {
            'repository_name': os.environ.get('REPO_NAME'),
            'branch': os.environ.get('BRANCH'),
            'commit_sha': os.environ.get('COMMIT_SHA'),
            'pipeline_run_identifier': os.environ.get('RUN_ID'),
            'execution_timestamp': datetime.utcnow().isoformat() + 'Z',
            'tests': tests,
            'total': total,
            'passed': passed,
            'failed': failed,
            'overall_test_status': 'passed' if failed == 0 else 'failed'
        }
        
        with open('test-report.json', 'w') as f:
            json.dump(report, f, indent=2)
        
        print(json.dumps(report, indent=2))
        
        receiver_url = os.environ.get('RECEIVER_URL')
        if receiver_url:
            try:
                response = requests.post(f'{receiver_url}/report', json=report, timeout=30)
                print(f'Sent to receiver: {response.status_code}')
            except Exception as e:
                print(f'Failed to send to receiver: {e}')
        else:
            print('RECEIVER_URL not set')
        PYTHON
    
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: test-report.json
    
    - name: Send email report
      if: always()
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        REPO_NAME: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        COMMIT_SHA: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
      run: |
        python << 'PYTHON'
        import json
        import os
        import smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        from email.mime.application import MIMEApplication
        
        # Read report
        with open('test-report.json', 'r') as f:
            report = json.load(f)
        
        email_user = os.environ.get('EMAIL_USER')
        email_pass = os.environ.get('EMAIL_PASS')
        email_to = os.environ.get('EMAIL_TO')
        
        if not all([email_user, email_pass, email_to]):
            print('Email credentials not configured')
            exit(0)
        
        msg = MIMEMultipart()
        msg['From'] = email_user
        msg['To'] = email_to
        msg['Subject'] = f"DevOps CI Report - {report['overall_test_status'].upper()} - {report['commit_sha'][:7]}"
        
        body = f"""
        Repository: {report['repository_name']}
        Branch: {report['branch']}
        Commit: {report['commit_sha']}
        Pipeline Run: {report['pipeline_run_identifier']}
        Timestamp: {report['execution_timestamp']}
        
        Overall Status: {report['overall_test_status'].upper()}
        Total: {report['total']}, Passed: {report['passed']}, Failed: {report['failed']}
        
        Test Results:
        """
        for t in report['tests']:
            body += f"\n- {t['name']}: {t['result']}"
            if t['failure_message']:
                body += f"\n  Failure: {t['failure_message'][:100]}"
        
        msg.attach(MIMEText(body, 'plain'))
        
        # Attach report
        with open('test-report.json', 'rb') as f:
            part = MIMEApplication(f.read(), Name='test-report.json')
        part['Content-Disposition'] = 'attachment; filename="test-report.json"'
        msg.attach(part)
        
        try:
            server = smtplib.SMTP('smtp.gmail.com', 587)
            server.starttls()
            server.login(email_user, email_pass)
            server.send_message(msg)
            server.quit()
            print('Email sent successfully')
        except Exception as e:
            print(f'Failed to send email: {e}')
        PYTHON

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Pages
      uses: actions/configure-pages@v5
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './docs'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
